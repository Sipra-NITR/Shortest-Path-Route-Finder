<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RouteIQ - Smart Route Finder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:2.5rem;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#e2e8f0;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#334155;
    color:white;
    font-size:16px;
}

input:focus{
    outline:none;
    border:2px solid #38bdf8;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0ea5e9;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0284c7;
    transform:translateY(-2px);
}

.result{
    margin-top:30px;
    display:none;
}

.route-box{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
}

.distance{
    font-size:1.3rem;
    margin-bottom:15px;
    color:#38bdf8;
}

.path{
    line-height:2;
    font-size:1.1rem;
}

.city{
    background:#334155;
    padding:10px;
    border-radius:10px;
    text-align:center;
    margin:8px 0;
}

.arrow{
    text-align:center;
    font-size:22px;
    color:#38bdf8;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
}
</style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>🚗 RouteIQ</h1>

        <p class="subtitle">
            Smart Route Finder using Dijkstra Algorithm
        </p>

        <div class="form-group">
            <label>Source City</label>
            <input type="text" id="source" placeholder="Enter source city">
        </div>

        <div class="form-group">
            <label>Destination City</label>
            <input type="text" id="destination" placeholder="Enter destination city">
        </div>

        <button onclick="findRoute()">
            Find Best Route
        </button>

        <div class="result" id="result">

            <div class="route-box">

                <div class="distance" id="distance">
                </div>

                <div class="path" id="path">
                </div>

            </div>

        </div>

        <div class="footer">
            Route Optimization System
        </div>

    </div>

</div>

<script>

async function findRoute(){

    const source = document.getElementById("source").value;
    const destination = document.getElementById("destination").value;

    if(!source || !destination){
        alert("Please enter source and destination");
        return;
    }

    /*
       Replace this section with your backend API

       Example Spring Boot endpoint:
       http://localhost:8080/route?source=Bhubaneswar&destination=Puri
    */

    const data = {
        distance: 120,
        path: ["Bhubaneswar","Cuttack","Puri"]
    };

    document.getElementById("distance").innerHTML =
        "📍 Distance : " + data.distance + " km";

    let html = "";

    data.path.forEach((city,index)=>{

        html += `<div class="city">${city}</div>`;

        if(index !== data.path.length-1){
            html += `<div class="arrow">↓</div>`;
        }
    });

    document.getElementById("path").innerHTML = html;

    document.getElementById("result").style.display="block";
}

/*
Example for Spring Boot

 const source=document.getElementById("source").value;
 const destination=document.getElementById("destination").value;

 const response = await fetch(
 `http://localhost:8080/route?source=${source}&destination=${destination}`
 );

 const data = await response.json();

 // display result
}
*/

</script>

</body>
</html>
